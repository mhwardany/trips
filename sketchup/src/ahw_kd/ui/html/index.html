<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHW Kitchen &amp; Dressing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="t-title">AHW KITCHEN &amp; DRESSING</h1>
      <span class="ver" id="version"></span>
      <span class="chip" id="selection-chip">new unit</span>
      <span class="chip" id="lang-chip">عربي</span>
    </div>
    <div id="credit"></div>
    <div id="preview"></div>
    <nav id="tabs"></nav>
  </header>

  <main>
    <section id="tab-unit"></section>
    <section id="tab-layout"></section>
    <section id="tab-carcass"></section>
    <section id="tab-fronts"></section>
    <section id="tab-interior"></section>
    <section id="tab-top"></section>
    <section id="tab-materials"></section>
    <section id="tab-pricing"></section>
    <section id="tab-room"></section>
    <section id="tab-presets"></section>
    <section id="tab-reports"></section>
  </main>

  <div id="status"></div>

  <footer>
    <button class="btn" id="btn-place" data-t="place">Place</button>
    <button class="btn" id="btn-insert" data-t="insert">Insert</button>
    <button class="btn primary" id="btn-apply" data-t="apply">Apply</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
